name: Sync jam games

on:
  schedule:
    # Every 10 minutes (fresher creator slugs / new entries during the jam).
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync games from RUN API
        run: npm run sync-games

      - name: Commit and push if game list or vote log changed
        run: |
          git add src/data/games.bundle.json public/games.json src/data/votes-day-baseline.json src/data/vote-sync-history.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync jam games from RUN API"
          git push
