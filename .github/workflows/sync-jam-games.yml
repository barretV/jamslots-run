name: Sync jam games

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync games from RUN API
        run: npm run sync-games

      - name: Commit and push if game list changed
        run: |
          git diff --quiet src/data/games.bundle.json public/games.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/games.bundle.json public/games.json
          git commit -m "chore: sync jam games from RUN API"
          git push
